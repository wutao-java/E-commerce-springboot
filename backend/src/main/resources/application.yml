server:
  port: 8080

spring:
  application:
    name: commerce-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/agent_commerce?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:commerce}
    password: ${DB_PASSWORD:commerce123}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Shanghai
  jackson:
    default-property-inclusion: non_null

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

app:
  seed-data: true
  agent:
    base-url: ${AGENT_BASE_URL:http://127.0.0.1:8000}
    connect-timeout-ms: ${AGENT_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${AGENT_READ_TIMEOUT_MS:15000}
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}
